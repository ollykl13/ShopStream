version: 2

models:
  - name: stg_events
    description: "Очищенные события e-commerce из raw_events"
    columns:
      - name: event_time
        description: "Время события"
        tests:
          - not_null
      - name: event_type
        description: "Тип: view / cart / purchase"
        tests:
          - not_null
          - accepted_values:
              values: ['view', 'cart', 'purchase']
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null